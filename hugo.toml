baseURL = "https://blog.example.com/"
languageCode = "it-it"
defaultContentLanguage = "it"
defaultContentLanguageInSubdir = false
title = "Prima del commit"
enableRobotsTXT = true

[params]
  homeURL = "https://baicode.dev/"
  description = "Decisioni tecniche reali: problema, alternative, scelta, compromessi."

[taxonomies]
  tag = "tags"

[languages]
  [languages.it]
    languageName = "Italiano"
    languageCode = "it-IT"
    weight = 1
    title = "Prima del commit"
    contentDir = "content/it"
  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    weight = 2
    title = "Prima del commit"
    contentDir = "content/en"

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
